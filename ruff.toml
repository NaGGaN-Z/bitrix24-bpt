# Lint-гейт (план bpt-builder-core T1). Селект закреплён ЯВНО: эволюция
# дефолтов ruff не должна менять гейт репо. Широкие наборы (SIM/UP/RUF/PLR/
# EXE) сознательно не включены: %-формат, open() без контекст-менеджера,
# shebang без +x — канон кодовой базы, не ошибки.
# bpt_out исключён как не-канон (та же политика, что у repo-lint:
# исполнённые рабочие скрипты, не код-база).
target-version = "py311"
line-length = 100
extend-exclude = ["bpt_out"]

[lint]
select = ["E4", "E7", "E9", "F"]
